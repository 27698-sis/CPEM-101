<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#3B1F14" />
  <title>CPEM N° 99 — Diccionario</title>
  <link rel="manifest" href="/CPEM-99/manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --earth: #3B1F14; --earth-mid: #5C2E1A; --terracota: #A04530;
      --ocre: #C4883B; --turquoise: #2E8080; --cream: #F5EFE0;
      --text-muted: #C4A882;
    }
    html, body { height: 100%; background: #F2EBD9; font-family: 'Nunito', sans-serif; overflow: hidden; }
    .app-frame { position: relative; width: 100%; max-width: 420px; height: 100vh; margin: 0 auto; overflow: hidden; display: flex; flex-direction: column; }
    
    .header { background: linear-gradient(155deg, #3B1F14 0%, #5C2E1A 55%, #2E4040 100%); padding: 20px 18px 18px; flex-shrink: 0; }
    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(196,136,59,0.3); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 18px; transition: background 0.2s; text-decoration: none; }
    .back-btn:hover { background: rgba(196,136,59,0.15); }
    .header-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--cream); flex: 1; }
    
    .search-box { position: relative; }
    .search-input { width: 100%; padding: 14px 18px 14px 44px; border: 1px solid rgba(196,136,59,0.3); border-radius: 12px; background: rgba(255,255,255,0.1); color: var(--cream); font-family: 'Nunito', sans-serif; font-size: 14px; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ocre); pointer-events: none; }
    
    .content { flex: 1; overflow-y: auto; padding: 20px 18px 100px; }
    .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; width: 100%; }
    
    .category-card { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px 16px; 
      border-radius: 12px; 
      text-align: center; 
      cursor: pointer; 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
      min-height: 120px;
      width: 100%;
      border: none;
    }
    .category-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    .category-card:active { transform: scale(0.98); }
    
    .category-card.saludos { background: linear-gradient(135deg, var(--ocre), #D49A4D); }
    .category-card.familia { background: linear-gradient(135deg, var(--terracota), #B85A42); }
    .category-card.escuela { background: linear-gradient(135deg, var(--turquoise), #3A9C9C); }
    .category-card.naturaleza { background: linear-gradient(135deg, var(--earth-mid), #6F3A25); }
    .category-card.numeros { background: linear-gradient(135deg, var(--ocre), #D49A4D); }
    .category-card.colores { background: linear-gradient(135deg, var(--turquoise), #3A9C9C); }
    
    .category-icon { font-size: 32px; margin-bottom: 8px; }
    .category-name { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    
    .word-item { 
      background: #FFFFFF; 
      padding: 16px; 
      border-radius: 8px; 
      border-left: 5px solid var(--ocre);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    
    .word-mapuche { 
      font-family: 'Lora', serif; 
      color: #3B1F14; 
      font-size: 16px; 
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .word-spanish { 
      font-weight: 500; 
      color: #5C2E1A; 
      font-size: 14px;
      margin-bottom: 6px;
    }
    
    .word-pronunciation { 
      font-size: 12px; 
      color: #9B7A5C; 
      font-style: italic;
    }
    
    .nav-bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; border-top: 1px solid #ddd; padding: 12px 18px; display: flex; gap: 10px; z-index: 100; }
    .nav-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; font-family: 'Nunito', sans-serif; font-size: 13px; }
    .nav-btn.active { background: var(--ocre); color: white; }
    .nav-btn:not(.active) { background: #f0f0f0; color: #666; }
    
    .list-title { 
      font-family: 'Cinzel', serif; 
      color: #3B1F14; 
      margin-bottom: 18px; 
      font-size: 18px;
      font-weight: 700;
    }
    
    .back-to-categories { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: none; font-family: 'Nunito', sans-serif; }
    .back-to-categories:hover { color: var(--ocre); }
    
    .search-results { display: flex; flex-direction: column; gap: 12px; }
    .no-results { text-align: center; color: #999; font-size: 14px; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="header">
      <div class="header-top">
        <a href="/CPEM-99/" class="back-btn">←</a>
        <h1 class="header-title">Diccionario Mapuche</h1>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar palabras..." />
      </div>
    </div>
    
    <div class="content">
      <div class="categories" id="categoriesContainer"></div>
      <div id="wordListContainer"></div>
      <div id="searchResultsContainer"></div>
    </div>
    
    <div class="nav-bottom">
      <button class="nav-btn active" onclick="showCategories()">Categorías</button>
      <button class="nav-btn" onclick="showFavorites()">Favoritos</button>
      <button class="nav-btn" onclick="showSettings()">Ajustes</button>
    </div>
  </div>

  <script>
    const dictionary = {
      version: "1.1",
      ultima_actualizacion: "2026-08-22",
      categorias: [
        {
          id: "saludos",

          color: "ocre",

          palabras: [
            {"mapu": "Mari mari", "es": "Hola", "pron": "ma-ri ma-ri"},
            {"mapu": "Mari mari antü", "es": "Buenos días", "pron": "ma-ri ma-ri an-tü"},
            {"mapu": "Mari mari rangiñ", "es": "Buenas tardes", "pron": "ma-ri ma-ri ran-giñ"},
            {"mapu": "Mari mari püllay", "es": "Buenas noches", "pron": "ma-ri ma-ri pü-llay"},
            {"mapu": "Pewkayal", "es": "Adiós", "pron": "pew-kay-yal"},
            {"mapu": "Fey mai", "es": "Hasta luego", "pron": "fey mai"},
            {"mapu": "Chaltu may", "es": "Gracias", "pron": "chal-tu may"},
            {"mapu": "Chaltu may mapu", "es": "Muchas gracias", "pron": "chal-tu may ma-pu"},
            {"mapu": "Fia may", "es": "Por favor", "pron": "fi-a may"},
            {"mapu": "May", "es": "Sí", "pron": "may"},
            {"mapu": "Nay", "es": "No", "pron": "nay"},
            {"mapu": "Ayüpäy", "es": "Disculpa", "pron": "a-yü-pä-y"}
          ]
        },
        {
          id: "familia",
          nombre: "Familia",
          color: "terracota",
          icon: "👨‍👩‍👧‍👦",
          palabras: [
            {"mapu": "Ñuke", "es": "Madre", "pron": "ñu-ke"},
            {"mapu": "Chaw", "es": "Padre", "pron": "chaw"},
            {"mapu": "Pichi", "es": "Hijo", "pron": "pi-chi"},
            {"mapu": "Pichi domo", "es": "Hija", "pron": "pi-chi do-mo"},
            {"mapu": "Kuku", "es": "Abuela", "pron": "ku-ku"},
            {"mapu": "Kuku (masc)", "es": "Abuelo", "pron": "ku-ku"},
            {"mapu": "Ká", "es": "Hermano", "pron": "ka"},
            {"mapu": "Lamngen", "es": "Hermana", "pron": "lam-ngen"},
            {"mapu": "Malon", "es": "Tío", "pron": "ma-lon"},
            {"mapu": "Kuku pual", "es": "Tía", "pron": "ku-ku pu-al"},
            {"mapu": "Tunten", "es": "Primo", "pron": "tun-ten"},
            {"mapu": "Lof", "es": "Familia", "pron": "lof"}
          ]
        },
        {
          id: "escuela",
          nombre: "La Escuela",
          color: "turquoise",
          icon: "📚",
          palabras: [
            {"mapu": "Kimche", "es": "Escuela", "pron": "kim-che"},
            {"mapu": "Kimchefe", "es": "Maestro", "pron": "kim-che-fe"},
            {"mapu": "Kimchefe domo", "es": "Maestra", "pron": "kim-che-fe do-mo"},

            {"mapu": "Winkun", "es": "Leer", "pron": "win-kun"},
            {"mapu": "Kuse", "es": "Pregunta", "pron": "ku-se"}
          ]
        },
        {
          id: "naturaleza",
          nombre: "Naturaleza",
          color: "earth-mid",
          icon: "🌿",
          palabras: [
            {"mapu": "Ko", "es": "Agua", "pron": "ko"},
            {"mapu": "Mapu", "es": "Tierra", "pron": "ma-pu"},
            {"mapu": "Antü", "es": "Sol", "pron": "an-tü"},
            {"mapu": "Küyen", "es": "Luna", "pron": "kü-yen"},
            {"mapu": "Tren", "es": "Estrella", "pron": "tren"},
            {"mapu": "Kütral", "es": "Fuego", "pron": "kü-tral"},
            {"mapu": "Püllay", "es": "Viento", "pron": "pü-llay"},
            {"mapu": "Kurü", "es": "Lluvia", "pron": "ku-rü"},
            {"mapu": "Rawe", "es": "Árbol", "pron": "ra-we"},
            {"mapu": "Pewma", "es": "Flor", "pron": "pew-ma"},
            {"mapu": "Opüm", "es": "Nieve", "pron": "o-püm"},
            {"mapu": "Wachu", "es": "Montaña", "pron": "wa-chu"}
          ]
        },
        {
          id: "numeros",
          nombre: "Números",
          color: "ocre",
          icon: "🔢",
          palabras: [
            {"mapu": "Kiñe", "es": "Uno", "pron": "ki-ñe"},
            {"mapu": "Epu", "es": "Dos", "pron": "e-pu"},
            {"mapu": "Küla", "es": "Tres", "pron": "kü-la"},
            {"mapu": "Meli", "es": "Cuatro", "pron": "me-li"},
            {"mapu": "Kechu", "es": "Cinco", "pron": "ke-chu"},
            {"mapu": "Marla", "es": "Diez", "pron": "mar-la"}
          ]
        },
        {
          id: "colores",
          nombre: "Colores",
          color: "turquoise",
          icon: "🎨",
          palabras: [
            {"mapu": "Meli kutral", "es": "Rojo", "pron": "me-li ku-tral"},
            {"mapu": "Kümeñ", "es": "Blanco", "pron": "kü-meñ"},
            {"mapu": "Kafu", "es": "Negro", "pron": "ka-fu"},
            {"mapu": "Kütrülpü", "es": "Azul", "pron": "kü-trül-pü"},
            {"mapu": "Pitra", "es": "Verde", "pron": "pit-ra"},
            {"mapu": "Willi", "es": "Amarillo", "pron": "wil-li"}
          ]
        }
      ]
    };

    function getAllWords() {
      let allWords = [];
      dictionary.categorias.forEach(cat => {
        cat.palabras.forEach(word => {
          allWords.push({ ...word, category: cat.nombre, categoryId: cat.id });
        });
      });
      return allWords;
    }

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      
      dictionary.categorias.forEach(cat => {
        const card = document.createElement('button');
        card.className = `category-card ${cat.id}`;
        card.innerHTML = `
          <div class="category-icon">${cat.icon}</div>
          <div class="category-name">${cat.nombre}</div>
        `;
        card.onclick = () => showWordList(cat);
        container.appendChild(card);
      });
    }

    function showWordList(category) {
      const container = document.getElementById('categoriesContainer');
      const listContainer = document.getElementById('wordListContainer');
      const searchContainer = document.getElementById('searchResultsContainer');
      
      container.style.display = 'none';
      searchContainer.innerHTML = '';
      
      let html = `<button class="back-to-categories" onclick="showCategories()">← Volver</button>`;
      html += `<h2 class="list-title">${category.nombre}</h2>`;
      html += '<div class="search-results">';
      
      category.palabras.forEach(word => {
        html += `
          <div class="word-item">
            <div class="word-mapuche">${word.mapu}</div>
            <div class="word-spanish">→ ${word.es}</div>
            <div class="word-pronunciation">📢 ${word.pron}</div>
          </div>
        `;
      });
      
      html += '</div>';
      listContainer.innerHTML = html;
    }

    function performSearch(query) {
      const container = document.getElementById('categoriesContainer');
      const listContainer = document.getElementById('wordListContainer');
      const searchContainer = document.getElementById('searchResultsContainer');
      
      if (query.trim() === '') {
        showCategories();
        return;
      }
      
      container.style.display = 'none';
      listContainer.innerHTML = '';
      
      const allWords = getAllWords();
      const results = allWords.filter(word => 
        word.mapu.toLowerCase().includes(query.toLowerCase()) ||
        word.es.toLowerCase().includes(query.toLowerCase()) ||
        word.pron.toLowerCase().includes(query.toLowerCase())
      );
      
      let html = `<button class="back-to-categories" onclick="showCategories()">← Volver</button>`;
      html += `<h2 class="list-title">Resultados: "${query}"</h2>`;
      
      if (results.length === 0) {
        html += `<div class="no-results">No se encontraron palabras. Intenta otro búsqueda.</div>`;
      } else {
        html += '<div class="search-results">';
        results.forEach(word => {
          html += `
            <div class="word-item">
              <div class="word-mapuche">${word.mapu}</div>
              <div class="word-spanish">→ ${word.es}</div>
              <div class="word-pronunciation">📢 ${word.pron}</div>
            </div>
          `;
        });
        html += '</div>';
      }
      
      searchContainer.innerHTML = html;
    }

    function showCategories() {
      document.getElementById('categoriesContainer').style.display = 'grid';
      document.getElementById('wordListContainer').innerHTML = '';
      document.getElementById('searchResultsContainer').innerHTML = '';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.nav-btn')[0].classList.add('active');
    }

    function showFavorites() {
      alert('Sección de favoritos (próximamente)');
    }

    function showSettings() {
      alert('Ajustes (próximamente)');
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      performSearch(e.target.value);
    });

    // Inicializar
    renderCategories();
  </script>
</body>
</html>
