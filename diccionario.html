<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#3B1F14" />
  <title>CPEM N° 99 — Diccionario</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --earth: #3B1F14; --earth-mid: #5C2E1A; --terracota: #A04530;
      --ocre: #C4883B; --turquoise: #2E8080; --cream: #F5EFE0;
      --text-muted: #C4A882;
    }
    html, body { height: 100%; background: #F2EBD9; font-family: 'Nunito', sans-serif; overflow: hidden; }
    .app-frame { position: relative; width: 100%; max-width: 420px; height: 100vh; margin: 0 auto; overflow: hidden; display: flex; flex-direction: column; }
    
    .header { background: linear-gradient(155deg, #3B1F14 0%, #5C2E1A 55%, #2E4040 100%); padding: 20px 18px 18px; flex-shrink: 0; }
    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(196,136,59,0.3); background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; [...]
    .header-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--cream); flex: 1; }
    
    .search-box { position: relative; }
    .search-input { width: 100%; padding: 14px 18px 14px 44px; border: 1px solid rgba(196,136,59,0.3); border-radius: 12px; background: rgba(255,255,255,0.1); color: var(--cream); font-family: 'Nunito[...]
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--ocre); pointer-events: none; }
    
    .content { flex: 1; overflow-y: auto; padding: 20px 18px 100px; }
    .categories { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; width: 100%; }
    
    .category-card { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px 16px; 
      border-radius: 12px; 
      text-align: center; 
      cursor: pointer; 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
      min-height: 120px;
      width: 100%;
    }
    .category-card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    
    .category-card.saludos { background: linear-gradient(135deg, var(--ocre), #D49A4D); }
    .category-card.familia { background: linear-gradient(135deg, var(--terracota), #B85A42); }
    .category-card.escuela { background: linear-gradient(135deg, var(--turquoise), #3A9C9C); }
    .category-card.naturaleza { background: linear-gradient(135deg, var(--earth-mid), #6F3A25); }
    .category-card.numeros { background: linear-gradient(135deg, var(--ocre), #D49A4D); }
    .category-card.colores { background: linear-gradient(135deg, var(--turquoise), #3A9C9C); }
    
    .category-icon { font-size: 32px; margin-bottom: 8px; }
    .category-name { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    
    .word-item { 
      background: #FFFFFF; 
      padding: 16px; 
      border-radius: 8px; 
      border-left: 5px solid var(--ocre);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .word-mapuche { 
      font-family: 'Lora', serif; 
      color: #3B1F14; 
      font-size: 16px; 
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .word-spanish { 
      font-weight: 500; 
      color: #5C2E1A; 
      font-size: 14px;
      margin-bottom: 6px;
    }
    
    .word-pronunciation { 
      font-size: 12px; 
      color: #9B7A5C; 
      font-style: italic;
    }
    
    .nav-bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: white; border-top: 1px solid #ddd; padding: 12px 18px; display: flex; g[...]
    .nav-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .nav-btn.active { background: var(--ocre); color: white; }
    .nav-btn:not(.active) { background: #f0f0f0; color: #666; }
    
    .list-title { 
      font-family: 'Cinzel', serif; 
      color: #3B1F14; 
      margin-bottom: 18px; 
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="header">
      <div class="header-top">
        <a href="/CPEM-99/" class="back-btn">←</a>
        <h1 class="header-title">Diccionario Mapuche</h1>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="Buscar palabras..." />
      </div>
    </div>
    
    <div class="content">
      <div class="categories" id="categoriesContainer"></div>
      <div id="wordListContainer"></div>
    </div>
    
    <div class="nav-bottom">
      <button class="nav-btn active" onclick="showCategories()">Categorías</button>
      <button class="nav-btn" onclick="showFavorites()">Favoritos</button>
      <button class="nav-btn" onclick="showSettings()">Ajustes</button>
    </div>
  </div>

  <script>
    let dictionary = null;

    async function loadDictionary() {
      try {
        const res = await fetch('contenido/diccionario.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        dictionary = data;
        renderCategoriesFromData(dictionary);
      } catch (err) {
        console.error('No se pudo cargar el diccionario:', err);
        // Fallback mínimo: mostrar mensaje
        document.getElementById('categoriesContainer').innerHTML = '<p style="color:#666">No hay contenido disponible offline.</p>';
      }
    }

    function renderCategoriesFromData(data) {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      data.categorias.forEach(cat => {
        const card = document.createElement('div');
        card.className = `category-card ${cat.id}`;
        const icon = cat.icon || '📚';
        card.innerHTML = `
          <div class="category-icon">${icon}</div>
          <div class="category-name">${cat.nombre}</div>
        `;
        card.onclick = () => showWordList(cat);
        container.appendChild(card);
      });
    }

    function showWordList(category) {
      const container = document.getElementById('categoriesContainer');
      const listContainer = document.getElementById('wordListContainer');
      container.style.display = 'none';
      let html = `<h2 class="list-title">${category.nombre}</h2>`;
      html += '<div style="display: flex; flex-direction: column; gap: 12px;">';
      category.palabras.forEach(word => {
        html += `
          <div class="word-item">
            <div class="word-mapuche">${word.mapu || word.mapuche || ''}</div>
            <div class="word-spanish">→ ${word.es || ''}</div>
            <div class="word-pronunciation">📢 ${word.pron || ''}</div>
          </div>
        `;
      });
      html += '</div>';
      listContainer.innerHTML = html;
      const backBtn = document.querySelector('.back-btn');
      backBtn.onclick = (e) => {
        e.preventDefault();
        container.style.display = 'grid';
        listContainer.innerHTML = '';
      };
    }

    function showCategories() {
      document.getElementById('categoriesContainer').style.display = 'grid';
      document.getElementById('wordListContainer').innerHTML = '';
    }

    function showFavorites() {
      alert('Sección de favoritos (próximamente)');
    }

    function showSettings() {
      alert('Ajustes (próximamente)');
    }

    // Inicializar
    loadDictionary();
  </script>
</body>
</html>
